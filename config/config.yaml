# bdb-qchipms Configuration

# Global Static References
references:
  uniprot_db: &uniprot "data/references/uniprot_human.fasta"
  chrom_sizes: &chrom_sizes "data/references/hg38.chrom.sizes"

# Rule Configuration Blocks
validate_inputs:
  samples_tsv: "config/samples.tsv"
  protein_table: "data/protein_intensities.tsv"

lfq_enrichment:
  protein_table: "data/protein_intensities.tsv"
  uniprot_db: *uniprot
  enriched_tsv: "results/enrichment/qchip_ms_enriched_proteins.tsv"
  volcano_png: "results/plots/qchip_ms_volcano.png"

locus_annotation:
  enriched_tsv: "results/enrichment/qchip_ms_enriched_proteins.tsv"
  peaks_bed: "data/macs2_peaks.bed"
  chrom_sizes: *chrom_sizes
  annotated_bed: "results/annotation/qchip_ms_locus_annotated.bed"

summary_report:
  enriched_tsv: "results/enrichment/qchip_ms_enriched_proteins.tsv"
  annotated_bed: "results/annotation/qchip_ms_locus_annotated.bed"
  html_report: "results/reports/qchip_ms_summary.html"

# Resource Configuration for Snakemake Retry Logic
resources:
  # Base memory in MB. Snakemake will multiply this by the attempt number on failure.
  base_mem_mb: 4000
  # Maximum memory limit in MB (e.g., 32GB)
  max_mem_mb: 32000
  # Base threads per job
  threads: 2
