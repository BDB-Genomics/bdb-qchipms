# Snakemake 8+ Slurm Execution Profile for BDB-Genomics
# Usage: snakemake --profile profiles/slurm

executor: slurm
jobs: 100
latency-wait: 60
restart-times: 2
max-jobs-per-second: 10
max-status-checks-per-second: 10
keep-going: true
rerun-incomplete: true
printshellcmds: true

# Global Default Resource Allocation per Node
default-resources:
  slurm_partition: "standard"
  runtime: 240
  mem_mb: 8000
  cpus_per_task: 4

# Rule-Specific Fine-Grained Overrides for Heavy Tasks
set-resources:
  align_reads:
    cpus_per_task: 16
    mem_mb: 32000
    runtime: 360
  run_tobias_footprinting:
    cpus_per_task: 16
    mem_mb: 48000
    runtime: 480
  score_biophysical_loci:
    cpus_per_task: 8
    mem_mb: 16000
    runtime: 120
