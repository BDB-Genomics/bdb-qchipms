name: CI - Test bdb-qchipms Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System & Bioconda Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bedtools

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml matplotlib seaborn scipy pytest snakemake

      - name: Verify Environment
        run: |
          python --version
          snakemake --version
          bedtools --version

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v

      - name: Validate Snakemake Dry-Run
        run: |
          snakemake -n --cores 2
